name: Docs site

# Builds the G# documentation website (Docusaurus, in /website) and deploys it
# to GitHub Pages. Pull requests build only; main pushes, nightly schedules,
# and main-branch manual runs deploy.
#
# After the first merge, a repository admin must set:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'src/Core/**'
      - 'src/Compiler/**'
      - 'src/Repl/**'
      - 'test/Compiler.Tests/LanguageConformance/**'
      - 'test/Shared/GoldenFile.cs'
      - 'build/generate-quality-dashboard.py'
      - 'global.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'src/Core/**'
      - 'src/Compiler/**'
      - 'src/Repl/**'
      - 'test/Compiler.Tests/LanguageConformance/**'
      - 'test/Shared/GoldenFile.cs'
      - 'build/generate-quality-dashboard.py'
      - 'global.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '23 06 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore compiler
        run: dotnet restore src/Compiler/Compiler.csproj --locked-mode
      - name: Build compiler
        run: dotnet build src/Compiler/Compiler.csproj --configuration Release --no-restore -graph
      - name: Generate quality dashboard data
        run: python3 build/generate-quality-dashboard.py
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
