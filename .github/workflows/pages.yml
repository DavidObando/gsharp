name: Docs site

# Builds the G# documentation website (Docusaurus, in /website) and deploys it
# to GitHub Pages. Pull requests build and check the site against the
# checked-in concurrency snapshot; main pushes, nightly schedules, and
# main-branch manual runs refresh that snapshot and deploy.
#
# After the first merge, a repository admin must set:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'global.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'global.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '23 06 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bench/concurrency/go/go.mod
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Import concurrency benchmark snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 website/scripts/update_concurrency.py
      - name: Verify ten-pattern correctness pairs
        run: python3 website/tests/verify-concurrency-patterns.py --race
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Check website types and content
        working-directory: website
        run: npm run typecheck && npm run test:content
      - name: Verify published website examples
        run: python3 website/tests/verify-examples.py
      - name: Verify downloadable Trail project
        run: python3 website/tests/verify-trail.py
      - name: Verify benchmark snapshot validation
        run: python3 -m unittest discover -s website/tests -p test_concurrency_snapshot.py
      - name: Install browser test engines
        working-directory: website
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Check website interactions and accessibility
        working-directory: website
        run: npm run test:browser
      - name: Upload website review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-results
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  visual:
    name: Website visual baselines
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies and browser
        working-directory: website
        run: npm ci && npx playwright install chromium
      - name: Build and compare reviewed visuals
        working-directory: website
        run: python3 tests/verify-swift.py && npm run build && npm run test:visual
      - name: Upload visual comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-results
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
