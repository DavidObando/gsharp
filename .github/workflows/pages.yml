name: Docs site

# Builds the G# documentation website (Docusaurus, in /website) and deploys it
# to GitHub Pages. Pull requests validate the generator CLI and site against
# the checked-in snapshot without rerunning benchmarks; main pushes, nightly
# schedules, and main-branch manual runs regenerate data and deploy.
#
# After the first merge, a repository admin must set:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'src/Core/**'
      - 'src/Compiler/**'
      - 'src/Repl/**'
      - 'test/Compiler.Tests/LanguageConformance/**'
      - 'test/Shared/GoldenFile.cs'
      - 'build/generate-quality-dashboard.py'
      - 'global.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'samples/**'
      - 'src/Core/**'
      - 'src/Compiler/**'
      - 'src/Repl/**'
      - 'test/Compiler.Tests/LanguageConformance/**'
      - 'test/Shared/GoldenFile.cs'
      - 'build/generate-quality-dashboard.py'
      - 'global.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '23 06 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate quality dashboard generator CLI
        if: github.event_name == 'pull_request'
        run: python3 build/generate-quality-dashboard.py --help
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore compiler
        if: github.event_name != 'pull_request'
        run: dotnet restore src/Compiler/Compiler.csproj --locked-mode
      - name: Build compiler
        if: github.event_name != 'pull_request'
        run: dotnet build src/Compiler/Compiler.csproj --configuration Release --no-restore -graph
      # ADR-0174 D11. The concurrency rows are measured here rather than
      # downloaded from the nightly, so the dashboard's numbers and its
      # conformance numbers come from the same machine and the same commit.
      # Best-effort: a failure here must not stop the site from deploying, and
      # a missing results file means the dashboard shows no concurrency rows
      # rather than stale ones.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bench/concurrency/go/go.mod
      - name: Measure concurrency benchmark
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          dotnet build src/Sdk/Gsharp.Extensions --configuration Release
          python3 build/run-concurrency-bench.py --launches 6 --go             --json "$RUNNER_TEMP/concurrency.json"
      - name: Generate quality dashboard data
        if: github.event_name != 'pull_request'
        run: |
          python3 build/generate-quality-dashboard.py             --concurrency-json "$RUNNER_TEMP/concurrency.json"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        working-directory: website
        run: npm ci
      - name: Import concurrency workflow snapshot
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 website/scripts/update_concurrency.py
      - name: Verify ten-pattern correctness pairs
        run: python3 website/tests/verify-concurrency-patterns.py --race
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Check website types and content
        working-directory: website
        run: npm run typecheck && npm run test:content
      - name: Verify published website examples
        run: python3 website/tests/verify-examples.py
      - name: Verify downloadable Trail project
        run: python3 website/tests/verify-trail.py
      - name: Verify benchmark snapshot validation
        run: python3 -m unittest discover -s website/tests -p test_concurrency_snapshot.py
      - name: Install browser test engines
        working-directory: website
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Check website interactions and accessibility
        working-directory: website
        run: npm run test:browser
      - name: Upload website review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-results
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  visual:
    name: Website visual baselines
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies and browser
        working-directory: website
        run: npm ci && npx playwright install chromium
      - name: Build and compare reviewed visuals
        working-directory: website
        run: python3 tests/verify-swift.py && npm run build && npm run test:visual
      - name: Upload visual comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-results
          path: |
            website/playwright-report
            website/test-results
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
