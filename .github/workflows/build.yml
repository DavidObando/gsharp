name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      # Cut-over stack: the Phase 3 PR is based on the Phase 2 branch, so the
      # workflow must also run for it. Remove once the cut-over has merged.
      - cutover/phase2-prereqs

# Cancel superseded PR runs: every push to a PR starts a new run, and without
# this the older runs of the same PR keep consuming runners (and starve other
# PRs and Copilot review) until they finish. The group is keyed on the PR
# number for pull_request events, so only runs of the same PR share it.
# Pushes to main and `v*` tags (which run the publish job) get a group unique
# to the run (github.run_id), so they never cancel or queue behind each other,
# and cancel-in-progress is false for them regardless.
# The group name is `build-...`, distinct from the job-level
# `hot-core-translation-guard-<PR>` group below, which is kept so the guard
# job's own cancellation semantics stay unchanged.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nerdbank.GitVersioning's GitHub Actions integration appends
  # GitBuildVersion* lines to $GITHUB_ENV from every MSBuild node; with
  # parallel builds (-graph, dotnet test) concurrent appends interleave and
  # corrupt the file, failing shards with "Unable to process file command
  # 'env': Invalid format". No step in any workflow consumes those variables
  # (version stamping goes through the nbgv CLI instead), so disable the
  # emission workflow-wide. The gate property in Nerdbank.GitVersioning
  # 3.11's targets is NBGV_SetCloudBuildVersionVars; the cloud build-number
  # path is already a no-op on GitHub Actions.
  NBGV_SetCloudBuildVersionVars: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        # Brings in `dotnet-ilverify`, which Compiler.Tests invokes via
        # `IlVerifier.Verify` to mechanically validate every assembly emitted
        # by gsc against ECMA-335. The manifest is at .config/dotnet-tools.json.
        run: dotnet tool restore

      - name: Show Nerdbank.GitVersioning version
        # Surface the version nbgv will stamp on assemblies / NuGet packages so
        # that, when a build from `main` is green, the printed NuGetPackageVersion
        # can be used directly as the `vX.Y.Z` release tag.
        run: |
          dotnet tool install --global nbgv || dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          nbgv get-version
          {
            echo "### Nerdbank.GitVersioning"
            echo ''
            echo '```'
            nbgv get-version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        # Build the solution explicitly with the static project graph so each
        # project (notably Compiler, which is referenced by Compiler.Tests) is
        # built exactly once. A bare `dotnet build` schedules projects in
        # parallel against a shared OutputPath and can race on
        # GenerateRuntimeConfigurationFiles writing `gsc.runtimeconfig.json`.
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Check canonical G# formatting
        run: |
          dotnet out/bin/Release/Gsfmt.Cli/gsfmt.dll --check .
          dotnet out/bin/Release/Gsfmt.Cli/gsfmt.dll --check .

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          # Include .snupkg symbol packages alongside .nupkg so they survive
          # to the publish job (dotnet nuget push / gh release upload need
          # them co-located in ./nupkgs to pick them up).
          path: out/bin/Release/nupkgs/*

  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Generate test matrix
        id: matrix
        run: |
          python3 build/test-ci-test-matrix.py
          echo "matrix=$(python3 build/generate-ci-test-matrix.py)" >> "$GITHUB_OUTPUT"

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: discover-tests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-tests.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      # The cs2gs source-inspection tests (L1MigrationEndToEndTests,
      # Issue4545ManagedArrayProjectionSelfMigrationTests, ...) read the C#
      # originals of the compiler, which no longer exist in this tree
      # (docs/self-migration-cutover.md, "Source-inspection tests need the
      # final C# tree"). They are pointed at the final C# commit, checked out
      # beside the workspace. Only the Cs2Gs.Tests run gets the variable: the
      # Core.Tests guards must keep scanning this G# tree.
      - name: Check out the final C# tree for the cs2gs source-inspection tests
        uses: actions/checkout@v5
        with:
          ref: v0.4.1270
          path: csharp-source

      - name: Build
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Test
        env:
          MSBUILDDISABLENODEREUSE: 1
          TEST_FILTER: ${{ matrix.filter }}
          # Usually one project; the `fast-suites` shard carries several, because
          # a suite that runs in under a second should not cost a whole runner's
          # three minutes of setup to itself.
          TEST_PROJECTS: ${{ matrix.project }}
        run: |
          args=(
            --configuration Release
            --no-build
            --no-restore
            --logger "trx"
            --results-directory TestResults
          )
          if [[ -n "$TEST_FILTER" ]]; then
            args+=(--filter "$TEST_FILTER")
          fi
          if [[ "${{ matrix.name }}" == "interpreter" ]]; then
            args+=(--blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini)
          fi
          # TEST_PROJECTS is a space-separated project list and is deliberately
          # unquoted so it splits into one project per iteration.
          # shellcheck disable=SC2086
          for project in $TEST_PROJECTS; do
            case "$project" in
              *Cs2Gs.Tests*) export CS2GS_TEST_SOURCE_ROOT="$GITHUB_WORKSPACE/csharp-source" ;;
              *) unset CS2GS_TEST_SOURCE_ROOT ;;
            esac
            dotnet test "$project" "${args[@]}"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/**/*

  # The `tests` shards are `--filter` expressions over substrings of the
  # fully-qualified test name, and substring matching does not compose the way
  # the shard names suggest: `Emit.Issue1` also selects `Emit.Issue10`. A
  # rebalance can therefore drop a band's worth of coverage and leave every
  # shard green — silently testing less. This job enumerates every test in
  # every assembly, evaluates every shard's filter over that list, and fails
  # unless the shards partition it exactly.
  #
  # It runs in parallel with `tests` and is well inside their wall time, so it
  # never lengthens the run. The environment is deliberately bare:
  # GSHARP_DIFFERENTIAL_CONFORMANCE changes how many rows the language
  # conformance theory enumerates, so the check has to see the same corpus the
  # shards do.
  test-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify cs2gs counter contract
        run: build/test-cs2gs-counters.sh

      - name: Verify self-host stage-1 packer contract
        run: python3 build/test-selfhost-pack-stage1.py

      - name: Verify cut-over mechanics contract
        run: python3 build/test-cutover.py

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install stage-2 sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify isolated stage-2 certification contract
        run: |
          dotnet restore build/selfhost/PackageContentHash.gsproj --locked-mode
          dotnet restore build/selfhost/TestSupervisorLogger.gsproj --locked-mode
          dotnet build build/selfhost/PackageContentHash.gsproj --configuration Release --no-restore --nologo
          dotnet build build/selfhost/TestSupervisorLogger.gsproj --configuration Release --no-restore --nologo
          python3 build/test-selfhost-stage2.py

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Verify the self-host TRX comparison
        run: python3 build/test-selfhost-compare-trx.py

      - name: Build
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Verify every test is run exactly once
        run: python3 build/verify-ci-test-partition.py | tee -a "$GITHUB_STEP_SUMMARY"

      # ADR-0174 D11: the nightly benchmark is worthless if a PR can silently
      # break its registry, its G# program or its runner. Seconds here beat a
      # red nightly nobody is watching.
      - name: Verify the concurrency benchmark harness
        run: python3 build/verify-concurrency-bench.py --smoke

      - name: Verify the cs2gs apps gate issue logic
        run: python3 build/test-cs2gs-apps-gate-issues.py

      - name: Verify the self-host compiler benchmark gate
        run: |
          # The benchmark measures peak memory with GNU time.
          command -v /usr/bin/time >/dev/null || { sudo apt-get update && sudo apt-get install -y time; }
          python3 build/test-selfhost-bench.py

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup .NET 8 (for multitarget tests)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Install netcoredbg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/install-netcoredbg.sh

      - name: Run end-to-end tests
        run: ./build/run-e2e-tests.sh

  ilverify:
    # Part of #3163: compile every golden sample under samples/ with gsc and
    # run dotnet-ilverify over each emitted assembly, so unverifiable IL that
    # happens to execute correctly still fails CI. Known verifier false
    # positives are baselined in build/ilverify-known-failures.txt; any NEW
    # finding fails the job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Run ILVerify gate
        run: ./build/run-ilverify.sh

  nullable-hygiene:
    # ADR-0155 (issue #1364): enforce the post-flip nullable defaults, no
    # #nullable disable escapes in enabled production code, no CS8xxx
    # suppression via pragma/NoWarn/.editorconfig, no `= null!`, and a
    # justifying comment beside every added `!`. No build required, ~20s.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run nullable hygiene gate (remaining C# only)
        # After the cut-over the only production C# is src/vs-gsharp (plus test
        # fixtures and cs2gs inputs), which still enables nullable analysis.
        # Every check that scans tracked C# keeps running; `coverage` is
        # skipped because it asserts the shape of src/Core's C# files.
        run: |
          python3 build/nullable_hygiene.py \
            --base "origin/${{ github.base_ref || 'main' }}" \
            --check classify --check no-escapes --check suppressions \
            --check null-bang --check arg-null-bang --check forgiving \
            --check guard-added

      # Shares this job because it is equally cheap (seconds, no build) and the
      # job is already a required check. Every reference to the latest
      # published release must agree with website/src/data/release.json; the
      # checklist is docs/release/version-bump-checklist.md. This only reads
      # the checkout: it never builds, packs or publishes anything.
      - name: Test the release version reference check
        run: python3 build/test-check-release-version-refs.py

      - name: Check release version references
        run: python3 build/check-release-version-refs.py

  cs2gs-corpus:
    # ADR-0138: the C#→G# migration quality gate. Runs the full in-repo corpus
    # (L1–L5 + the conformance grid) through translate → compile → ilverify →
    # test-parity and gates on the gap ledger: any fingerprint NOT ledgered in
    # tools/cs2gs/triage/gaps.json (NEW) or ledgered as resolved but
    # reproducing (REGRESSED) fails the job; known-open gaps do not.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        # dotnet-ilverify for the pipeline's stage 3.
        run: dotnet tool restore

      - name: Build
        run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph

      - name: Migrate corpus (ledger-gated)
        run: |
          set +e
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll migrate \
            --diagnostic-run \
            --corpus tools/cs2gs/corpus \
            --baseline tools/cs2gs/triage/gaps.json \
            --out cs2gs-ci-runs \
            --config Release | tee cs2gs-migrate.log
          exit_code=${PIPESTATUS[0]}
          {
            echo "### cs2gs corpus migration"
            echo ''
            echo '```'
            cat cs2gs-migrate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-corpus-report
          path: |
            cs2gs-ci-runs/**/report.html
            cs2gs-ci-runs/**/summary.json
            cs2gs-ci-runs/**/run.json

  vscode-extension:
    name: vscode-extension (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: src/vscode-gsharp

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/vscode-gsharp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

  vsix:
    runs-on: ubuntu-latest
    needs: vscode-extension

    defaults:
      run:
        working-directory: src/vscode-gsharp

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/vscode-gsharp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Stamp version (Nerdbank.GitVersioning)
        # The VS Code Marketplace requires a strict major.minor.patch version, so
        # use nbgv's SimpleVersion (<version.json base>.<git-height>, e.g. 0.4.1129),
        # which is always clean across
        # branches and tags. The change is workspace-only and never committed.
        run: |
          dotnet tool install --global nbgv || dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION=$(nbgv get-version -v SimpleVersion)
          echo "Extension version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o vscode-gsharp.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: src/vscode-gsharp/vscode-gsharp.vsix

  visual-studio-extension:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify generated assets
        shell: pwsh
        run: ./src/vs-gsharp/scripts/Sync-SharedAssets.ps1 -Check

      - name: Build Visual Studio VSIX
        run: msbuild src\vs-gsharp\VsGsharp.sln /restore /t:Build /p:Configuration=Release /m /v:minimal /nologo

      - name: Test Visual Studio extension
        run: dotnet test src\vs-gsharp\test\VsGsharp.UnitTests\VsGsharp.UnitTests.csproj --configuration Release --no-build

      - name: Upload Visual Studio VSIX
        uses: actions/upload-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: src/vs-gsharp/src/VsGsharp/bin/Release/net472/GSharp.VisualStudio.vsix

  publish:
    runs-on: ubuntu-latest
    needs: [build, tests, test-partition, e2e, ilverify, cs2gs-corpus, vsix, visual-studio-extension]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      actions: read

    steps:
      - name: Require stage-2 certification of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow selfhost-stage2-nightly.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          if [[ "$ok" == "0" ]]; then
            echo "::error::No successful selfhost-stage2-nightly run for $GITHUB_SHA. Dispatch it on the tagged commit first (ADR-0198)."
            exit 1
          fi

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Download VSIX
        uses: actions/download-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: ./vsix

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: ./vsix

      - name: Create GitHub Release with all assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" ./nupkgs/*.nupkg ./nupkgs/*.snupkg ./vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath ./vsix/vscode-gsharp.vsix

  publish-visual-studio-extension:
    runs-on: windows-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v5

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: ./vsix

      - name: Publish to Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VSSDK `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio SDK installation not found."
          }

          $publisher = Join-Path $installPath `
            "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
          if (-not (Test-Path $publisher)) {
            throw "VsixPublisher.exe not found at $publisher."
          }

          & $publisher publish `
            -payload "$PWD\vsix\GSharp.VisualStudio.vsix" `
            -publishManifest "$PWD\src\vs-gsharp\vs-publish.json" `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio Marketplace publishing failed with exit code $LASTEXITCODE."
          }
