name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Cancel superseded PR runs: every push to a PR starts a new run, and without
# this the older runs of the same PR keep consuming runners (and starve other
# PRs and Copilot review) until they finish. The group is keyed on the PR
# number for pull_request events, so only runs of the same PR share it.
# Pushes to main and `v*` tags (which run the publish job) get a group unique
# to the run (github.run_id), so they never cancel or queue behind each other,
# and cancel-in-progress is false for them regardless.
concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nerdbank.GitVersioning's GitHub Actions integration appends
  # GitBuildVersion* lines to $GITHUB_ENV from every MSBuild node; with
  # parallel builds (-graph, dotnet test) concurrent appends interleave and
  # corrupt the file, failing shards with "Unable to process file command
  # 'env': Invalid format". No step in any workflow consumes those variables
  # (version stamping goes through the nbgv CLI instead), so disable the
  # emission workflow-wide. The gate property in Nerdbank.GitVersioning
  # 3.11's targets is NBGV_SetCloudBuildVersionVars; the cloud build-number
  # path is already a no-op on GitHub Actions.
  NBGV_SetCloudBuildVersionVars: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test CI routing contracts
        run: python3 build/test-ci-selection.py
      - name: Test fixed-array artifact workspace guard
        run: python3 build/test-fixed-array-aot-workspace.py
      - name: Select affected components
        id: select
        run: python3 build/ci-selection.py

  build:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'build')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        if: github.event_name != 'pull_request' || fromJSON(needs.select.outputs.plan).full
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore selected product graph
        if: github.event_name == 'pull_request' && !fromJSON(needs.select.outputs.plan).full
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).build_projects }}
        run: python3 build/ci-projects.py restore --projects "$PROJECTS"

      - name: Restore .NET local tools
        # Brings in `dotnet-ilverify`, which Compiler.Tests invokes via
        # `IlVerifier.Verify` to mechanically validate every assembly emitted
        # by gsc against ECMA-335. The manifest is at .config/dotnet-tools.json.
        run: dotnet tool restore

      - name: Show Nerdbank.GitVersioning version
        # Surface the version nbgv will stamp on assemblies / NuGet packages so
        # that, when a build from `main` is green, the printed NuGetPackageVersion
        # can be used directly as the `vX.Y.Z` release tag.
        run: |
          dotnet tool install --global nbgv || dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          nbgv get-version
          {
            echo "### Nerdbank.GitVersioning"
            echo ''
            echo '```'
            nbgv get-version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        if: github.event_name != 'pull_request' || fromJSON(needs.select.outputs.plan).full
        # Build the solution explicitly with the static project graph so each
        # project (notably Compiler, which is referenced by Compiler.Tests) is
        # built exactly once. A bare `dotnet build` schedules projects in
        # parallel against a shared OutputPath and can race on
        # GenerateRuntimeConfigurationFiles writing `gsc.runtimeconfig.json`.
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Build selected product graph
        if: github.event_name == 'pull_request' && !fromJSON(needs.select.outputs.plan).full
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).build_projects }}
        run: python3 build/ci-projects.py build --projects "$PROJECTS"

      - name: Check canonical G# formatting
        if: github.event_name != 'pull_request' || fromJSON(needs.select.outputs.plan).full
        run: |
          dotnet out/bin/Release/Gsfmt.Cli/gsfmt.dll --check .
          dotnet out/bin/Release/Gsfmt.Cli/gsfmt.dll --check .

      - name: Test the syntax child accessor generator
        run: python3 build/test-generate-syntax-children.py

      - name: Check the generated syntax child accessors are current
        # Issue #5136: SyntaxNode.Children.g.gs is written by build/generate-syntax-children.py
        # from the node classes. A property change without a regenerated file fails here.
        run: python3 build/generate-syntax-children.py --check

      - name: Test the netstandard host-reference check
        run: python3 build/test-check-netstandard-host-refs.py

      - name: Check packed netstandard2.0 SDK assemblies do not reference the host runtime
        # Issue #4921: tools/task/Gsharp.NET.Sdk.dll must load on .NET Framework
        # MSBuild, which has no System.Private.CoreLib.
        run: python3 build/check-netstandard-host-refs.py out/bin/Release/nupkgs/Gsharp.NET.Sdk.[0-9]*.nupkg

      - name: Test the netstandard member-reference check
        run: python3 build/test-check-netstandard-member-refs.py

      - name: Check packed netstandard2.0 SDK assemblies reference only members their target declares
        # Issue #4924: every TypeRef and MemberRef of tools/task/Gsharp.NET.Sdk.dll
        # must resolve on the netstandard2.0 reference surface it is compiled
        # against (NETStandard.Library + Microsoft.Build reference assemblies,
        # from the NuGet cache restored above); a host-only overload such as
        # String.Split(char, StringSplitOptions) fails on .NET Framework MSBuild.
        run: python3 build/check-netstandard-member-refs.py out/bin/Release/nupkgs/Gsharp.NET.Sdk.[0-9]*.nupkg

      - name: Test the release publish script
        run: python3 build/test-release-publish.py

      - name: Verify the packed NuGet packages
        # A component-scoped PR packs only the SDK and templates, so the full
        # inventory is required only when the whole solution was built.
        if: github.event_name != 'pull_request' || fromJSON(needs.select.outputs.plan).full
        # ADR-0218: the package inventory (six RID compiler packages, six other
        # packages, five symbol packages), one version across them, and the SDK's
        # PackageDownload version. The tag run checks the same list before it pushes.
        run: python3 build/release-publish.py verify --nuget-only --nupkgs out/bin/Release/nupkgs

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          # Include .snupkg symbol packages alongside .nupkg so they survive
          # to the publish job (dotnet nuget push / gh release upload need
          # them co-located in ./nupkgs to pick them up).
          path: out/bin/Release/nupkgs/*

  discover-tests:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'discover-tests')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Generate test matrix
        id: matrix
        run: |
          python3 build/test-ci-test-matrix.py
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "matrix=$(python3 build/generate-ci-test-matrix.py --projects "$PROJECTS")" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(python3 build/generate-ci-test-matrix.py)" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).projects }}

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Raised from 30: the G#-built suites compile and run slower than the C# ones did,
    # and the Cs2Gs.Tests shards also build the final C# tree. Rebalance the shards
    # (build/generate-ci-test-matrix.py) from this run's timings, then lower it.
    timeout-minutes: 90
    needs: [select, discover-tests]
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'tests')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-tests.outputs.matrix) }}
    env:
      GSHARP_5393_PRIVATE_ROUTE: >-
        ${{ github.event_name == 'pull_request' &&
            github.repository == 'DavidObando/gsharp' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.head_ref == 'fix/p0-5393-b12435c5-r2' &&
            matrix.name == 'core-remainder' }}
      # Requires a separate, exact-head observation approval.
      GSHARP_5393_DIAGNOSTIC: >-
        ${{ github.event_name == 'pull_request' &&
            github.repository == 'DavidObando/gsharp' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.head_ref == 'fix/p0-5393-b12435c5-r2' &&
            matrix.name == 'core-remainder' && github.run_attempt == 1 &&
            github.event.action == 'synchronize' && github.event.number == 5432 &&
            vars.GSHARP_5393_INITIAL_HEAD != '' &&
            github.event.pull_request.head.sha == vars.GSHARP_5393_INITIAL_HEAD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        if: github.event_name != 'pull_request'
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore selected test graph
        if: github.event_name == 'pull_request'
        env:
          PROJECTS: ${{ matrix.project }}
        run: python3 build/ci-projects.py restore --projects "$PROJECTS"

      - name: Restore .NET local tools
        run: dotnet tool restore

      # The cs2gs tests were written against a C# tree: the stage-4 contract
      # (CS2GS_TEST_SOURCE_ROOT) names ONE directory that holds the original
      # sources and also the built toolchain (out/bin/<Config>/nupkgs, gsc.dll).
      # The C# originals of the compiler no longer exist in this tree
      # (docs/self-migration-cutover.md, "Source-inspection tests need the
      # final C# tree"), so the Cs2Gs.Tests shards check out the final C# commit
      # beside the workspace and build it, and only they get the variable: the
      # Core.Tests guards must keep scanning this G# tree. The commit is the
      # single pin in tools/cs2gs/external/gsharp-csharp.json (also read by
      # cs2gs-apps-nightly.yml): the head of the semi-frozen cs2gs/csharp-0.4
      # branch, which takes back-ports such as the MessagePack bump for
      # GHSA-qhrr-8q5h-9q3h (#4941), so it no longer equals tag v0.4.1270.
      - name: Read the pinned C# commit for the cs2gs tests
        id: csharp-pin
        if: contains(matrix.project, 'Cs2Gs.Tests')
        run: echo "commit=$(jq -r '.commit' tools/cs2gs/external/gsharp-csharp.json)" >> "$GITHUB_OUTPUT"

      - name: Check out the final C# tree for the cs2gs tests
        if: contains(matrix.project, 'Cs2Gs.Tests')
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.csharp-pin.outputs.commit }}
          path: csharp-source
          fetch-depth: 0

      - name: Build the final C# tree for the cs2gs tests
        if: contains(matrix.project, 'Cs2Gs.Tests')
        run: |
          dotnet restore csharp-source/GSharp.sln --locked-mode
          dotnet build csharp-source/GSharp.sln --configuration Release --no-restore -graph

      - name: Build
        if: github.event_name != 'pull_request'
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Build selected test graph
        if: github.event_name == 'pull_request'
        env:
          PROJECTS: ${{ matrix.project }}
        run: python3 build/ci-projects.py build --projects "$PROJECTS"

      - name: Test
        if: env.GSHARP_5393_PRIVATE_ROUTE != 'true'
        env:
          MSBUILDDISABLENODEREUSE: 1
          TEST_FILTER: ${{ matrix.filter }}
          # Usually one project; the `fast-suites` shard carries several, because
          # a suite that runs in under a second should not cost a whole runner's
          # three minutes of setup to itself.
          TEST_PROJECTS: ${{ matrix.project }}
        run: |
          args=(
            --configuration Release
            --no-build
            --no-restore
            --logger "trx"
            --results-directory TestResults
          )
          if [[ -n "$TEST_FILTER" ]]; then
            args+=(--filter "$TEST_FILTER")
          fi
          if [[ "${{ matrix.name }}" == "interpreter" ]]; then
            args+=(--blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini)
          fi
          # TEST_PROJECTS is a space-separated project list and is deliberately
          # unquoted so it splits into one project per iteration.
          # shellcheck disable=SC2086
          for project in $TEST_PROJECTS; do
            case "$project" in
              *Cs2Gs.Tests*) export CS2GS_TEST_SOURCE_ROOT="$GITHUB_WORKSPACE/csharp-source" ;;
              *) unset CS2GS_TEST_SOURCE_ROOT ;;
            esac
            dotnet test "$project" "${args[@]}"
          done

      - name: Test core without diagnostic collection
        if: env.GSHARP_5393_PRIVATE_ROUTE == 'true' && env.GSHARP_5393_DIAGNOSTIC != 'true'
        env:
          MSBUILDDISABLENODEREUSE: 1
          TEST_FILTER: ${{ matrix.filter }}
          TEST_PROJECTS: ${{ matrix.project }}
          DOTNET_DbgEnableMiniDump: 0
          COMPlus_DbgEnableMiniDump: 0
        run: |
          python3 -B build/test-core-crash-diagnostics.py
          ulimit -c 0
          python3 build/core-crash-diagnostics.py test

      - name: Remove private core validation output
        if: always() && env.GSHARP_5393_PRIVATE_ROUTE == 'true' && env.GSHARP_5393_DIAGNOSTIC != 'true'
        run: python3 build/core-crash-diagnostics.py cleanup

      - name: Test with dump-free sequence
        id: test5393
        if: env.GSHARP_5393_DIAGNOSTIC == 'true'
        timeout-minutes: 16
        env:
          MSBUILDDISABLENODEREUSE: 1
          TEST_FILTER: ${{ matrix.filter }}
          TEST_PROJECTS: ${{ matrix.project }}
          GSHARP_5393_INITIAL_HEAD: ${{ vars.GSHARP_5393_INITIAL_HEAD }}
          DOTNET_DbgEnableMiniDump: 0
          COMPlus_DbgEnableMiniDump: 0
        run: |
          python3 -B build/test-core-crash-diagnostics.py
          python3 build/core-crash-diagnostics.py prepare
          ulimit -c 0
          unset CS2GS_TEST_SOURCE_ROOT
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            dotnet test "$TEST_PROJECTS" \
              --configuration Release --no-build --no-restore \
              --logger "trx;LogFileName=core-remainder.trx" \
              --results-directory out/5393-ci/private/results \
              --filter "$TEST_FILTER" --blame \
              >out/5393-ci/private/test.stdout 2>out/5393-ci/private/test.stderr
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Normalize core diagnostics
        id: diagnostic5393
        if: always() && env.GSHARP_5393_DIAGNOSTIC == 'true'
        timeout-minutes: 2
        env:
          TEST_EXIT_CODE: ${{ steps.test5393.outputs.exit_code }}
          TEST_FILTER: ${{ matrix.filter }}
          TEST_PROJECTS: ${{ matrix.project }}
          GSHARP_5393_INITIAL_HEAD: ${{ vars.GSHARP_5393_INITIAL_HEAD }}
        run: python3 build/core-crash-diagnostics.py finish

      - name: Upload test results
        if: always() && env.GSHARP_5393_PRIVATE_ROUTE != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/**/*

      - name: Upload sanitized core diagnostics
        if: always() && env.GSHARP_5393_DIAGNOSTIC == 'true' && steps.diagnostic5393.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: core-diagnostics-5393
          if-no-files-found: error
          path: |
            TestResults/5393/summary.json
            TestResults/5393/provenance.json
            TestResults/5393/test-sequence.json

  # The `tests` shards are `--filter` expressions over substrings of the
  # fully-qualified test name, and substring matching does not compose the way
  # the shard names suggest: `Emit.Issue1` also selects `Emit.Issue10`. A
  # rebalance can therefore drop a band's worth of coverage and leave every
  # shard green — silently testing less. This job enumerates every test in
  # every assembly, evaluates every shard's filter over that list, and fails
  # unless the shards partition it exactly.
  #
  # It runs in parallel with `tests` and needs the same build-and-verify budget:
  # the selected graph includes G#-built suites and staged SDK payloads before
  # theory discovery can enumerate every test. The environment is deliberately bare:
  # GSHARP_DIFFERENTIAL_CONFORMANCE changes how many rows the language
  # conformance theory enumerates, so the check has to see the same corpus the
  # shards do.
  test-partition:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'test-partition')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        if: github.event_name != 'pull_request'
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore selected test graph
        if: github.event_name == 'pull_request'
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).projects }}
        run: python3 build/ci-projects.py restore --projects "$PROJECTS"

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build
        if: github.event_name != 'pull_request'
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Build selected test graph
        if: github.event_name == 'pull_request'
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).projects }}
        run: python3 build/ci-projects.py build --projects "$PROJECTS"

      - name: Verify every test is run exactly once
        if: github.event_name != 'pull_request'
        shell: bash
        run: python3 build/verify-ci-test-partition.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify selected tests are run exactly once
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROJECTS: ${{ fromJSON(needs.select.outputs.plan).projects }}
        run: python3 build/verify-ci-test-partition.py --projects "$PROJECTS" | tee -a "$GITHUB_STEP_SUMMARY"

  harness:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'harness')
    name: harness (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.plan).harness_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install stage-2 sandbox
        if: matrix.name == 'stage2'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify selected harness
        env:
          HARNESS: ${{ matrix.name }}
        run: |
          case "$HARNESS" in
            counters) build/test-cs2gs-counters.sh ;;
            stage1)
              python3 build/test-selfhost-pack-stage1.py
              python3 build/test-rid-compiler-packages.py ;;
            stage2)
              dotnet restore build/selfhost/PackageContentHash.gsproj --locked-mode
              dotnet restore build/selfhost/TestSupervisorLogger.gsproj --locked-mode
              dotnet build build/selfhost/PackageContentHash.gsproj --configuration Release --no-restore --nologo
              dotnet build build/selfhost/TestSupervisorLogger.gsproj --configuration Release --no-restore --nologo
              python3 build/test-selfhost-stage2.py ;;
            concurrency) python3 build/verify-concurrency-bench.py --smoke ;;
            apps)
              python3 build/test-cs2gs-apps-gate-issues.py
              python3 build/test-cs2gs-apps-leg.py ;;
            selfhost-bench)
              command -v /usr/bin/time >/dev/null || { sudo apt-get update && sudo apt-get install -y time; }
              python3 build/test-selfhost-bench.py
              python3 build/test-compiler-bench.py ;;
            comment-checker)
              dotnet restore build/gstokens/GsTokens.gsproj --locked-mode
              python3 build/test-check-comment-only-diff.py ;;
            *) echo "Unknown harness: $HARNESS" >&2; exit 1 ;;
          esac

  format:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'format')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore src/Formatting/Gsfmt.Cli/Gsfmt.Cli.gsproj --locked-mode
      - run: dotnet build src/Formatting/Gsfmt.Cli/Gsfmt.Cli.gsproj --configuration Release --no-restore -graph
      - run: dotnet out/bin/Release/Gsfmt.Cli/gsfmt.dll --check .

  e2e:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'e2e')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup .NET 8 (for multitarget tests)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: github.event_name != 'pull_request'
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore SDK and cs2gs dependency graph
        if: github.event_name == 'pull_request'
        run: python3 build/ci-projects.py restore --projects "tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj src/Sdk/Gsharp.Templates/Gsharp.Templates.gsproj"

      - name: Install netcoredbg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/install-netcoredbg.sh

      - name: Run end-to-end tests
        run: ./build/run-e2e-tests.sh

  ilverify:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'ilverify')
    # Part of #3163: compile every golden sample under samples/ with gsc and
    # run dotnet-ilverify over each emitted assembly, so unverifiable IL that
    # happens to execute correctly still fails CI. Known verifier false
    # positives are baselined in build/ilverify-known-failures.txt; any NEW
    # finding fails the job.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Run ILVerify gate
        run: ./build/run-ilverify.sh

  release-version-refs:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'release-version-refs')
    # Every reference to the latest published release must agree with
    # website/src/data/release.json; the checklist is
    # docs/release/version-bump-checklist.md. Cheap (seconds, no build); it only
    # reads the checkout and never builds, packs or publishes anything.
    # (This used to share the `nullable-hygiene` job, retired in #4906.)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test the release version reference check
        run: python3 build/test-check-release-version-refs.py

      - name: Check release version references
        run: python3 build/check-release-version-refs.py

  cs2gs-corpus:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'cs2gs-corpus')
    # ADR-0138: the C#→G# migration quality gate. Runs the full in-repo corpus
    # (L1–L5 + the conformance grid) through translate → compile → ilverify →
    # test-parity and gates on the gap ledger: any fingerprint NOT ledgered in
    # tools/cs2gs/triage/gaps.json (NEW) or ledgered as resolved but
    # reproducing (REGRESSED) fails the job; known-open gaps do not.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        if: github.event_name != 'pull_request'
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore cs2gs dependency graph
        if: github.event_name == 'pull_request'
        run: dotnet restore tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --locked-mode

      - name: Restore .NET local tools
        # dotnet-ilverify for the pipeline's stage 3.
        run: dotnet tool restore

      - name: Build
        run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph

      - name: Migrate corpus (ledger-gated)
        run: |
          set +e
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll migrate \
            --diagnostic-run \
            --corpus tools/cs2gs/corpus \
            --baseline tools/cs2gs/triage/gaps.json \
            --out cs2gs-ci-runs \
            --config Release | tee cs2gs-migrate.log
          exit_code=${PIPESTATUS[0]}
          {
            echo "### cs2gs corpus migration"
            echo ''
            echo '```'
            cat cs2gs-migrate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-corpus-report
          path: |
            cs2gs-ci-runs/**/report.html
            cs2gs-ci-runs/**/summary.json
            cs2gs-ci-runs/**/run.json

  vscode-extension:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'vscode-extension')
    name: vscode-extension (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: src/vscode-gsharp

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/vscode-gsharp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit

  vsix:
    runs-on: ubuntu-latest
    needs: [select, vscode-extension]
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'vsix')

    defaults:
      run:
        working-directory: src/vscode-gsharp

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/vscode-gsharp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Stamp version (Nerdbank.GitVersioning)
        # The VS Code Marketplace requires a strict major.minor.patch version, so
        # use nbgv's SimpleVersion (<version.json base>.<git-height>, e.g. 0.4.1129),
        # which is always clean across
        # branches and tags. The change is workspace-only and never committed.
        run: |
          dotnet tool install --global nbgv || dotnet tool update --global nbgv
          export PATH="$PATH:$HOME/.dotnet/tools"
          VERSION=$(nbgv get-version -v SimpleVersion)
          echo "Extension version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        # ADR-0218: a prerelease tag packages a pre-release extension; the marker is inside the VSIX.
        # The kind comes from the one tag-kind definition. Pull requests and main are kind none.
        run: |
          flags=()
          if [ "$(python3 ../../build/release-publish.py tag-kind "$GITHUB_REF_NAME")" = prerelease ]; then flags+=(--pre-release); fi
          npx vsce package --no-dependencies "${flags[@]}" -o vscode-gsharp.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: src/vscode-gsharp/vscode-gsharp.vsix

  visual-studio-extension:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'visual-studio-extension')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify generated assets
        shell: pwsh
        run: ./src/vs-gsharp/scripts/Sync-SharedAssets.ps1 -Check

      - name: Build Visual Studio VSIX
        run: msbuild src\vs-gsharp\VsGsharp.sln /restore /t:Build /p:Configuration=Release /m /v:minimal /nologo

      - name: Test Visual Studio extension
        run: dotnet test src\vs-gsharp\test\VsGsharp.UnitTests\VsGsharp.UnitTests.csproj --configuration Release --no-build

      - name: Upload Visual Studio VSIX
        uses: actions/upload-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: src/vs-gsharp/src/VsGsharp/bin/Release/net472/GSharp.VisualStudio.vsix

  desktop-msbuild-sdk-smoke:
    # Issue #4924: prove that Visual Studio's MSBuild (.NET Framework) loads and
    # runs the Gsharp.NET.Sdk task assembly packed by THIS build, before any
    # release. The visual-studio-extension job above uses the SDK version pinned
    # in global.json (a published release), so it only sees a task defect after
    # that release has shipped. Here global.json is re-pinned, in the runner's
    # checkout only, to the in-tree package, served from the repository's local
    # `.nugs` feed (nuget.config). InternalAnalyzers.gsproj is the project the
    # 0.5.6 task failed on; the repository .editorconfig's `[*.{gs,gsproj}]`
    # section drives EditorConfigSeverityReader through String.Split.
    runs-on: windows-latest
    needs: [select, build]
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'desktop-msbuild-sdk-smoke')

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./.nugs

      - name: Pin global.json to the in-tree Gsharp.NET.Sdk
        id: pin
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .nugs -Filter 'Gsharp.NET.Sdk.*.nupkg' | Where-Object { $_.Name -match '^Gsharp\.NET\.Sdk\.(\d+\.\d+\.\d+[^\\/]*)\.nupkg$' })
          if ($packages.Count -ne 1) { throw "expected exactly one Gsharp.NET.Sdk package in .nugs, found $($packages.Count): $($packages.Name -join ', ')" }
          $null = $packages[0].Name -match '^Gsharp\.NET\.Sdk\.(.+)\.nupkg$'
          $version = $Matches[1]
          $json = Get-Content global.json -Raw | ConvertFrom-Json
          $json.'msbuild-sdks'.'Gsharp.NET.Sdk' = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content global.json -Encoding utf8
          Get-Content global.json
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build InternalAnalyzers with desktop MSBuild and the in-tree SDK
        run: msbuild src\Analyzers\InternalAnalyzers\InternalAnalyzers.gsproj /restore /t:Build /p:Configuration=Release /m /v:minimal /nologo

      - name: Verify the in-tree SDK task ran
        shell: pwsh
        run: |
          $version = '${{ steps.pin.outputs.version }}'
          $sdk = Join-Path $env:USERPROFILE ".nuget\packages\gsharp.net.sdk\$version\tools\task\Gsharp.NET.Sdk.dll"
          if (-not (Test-Path $sdk)) { throw "the build did not resolve Gsharp.NET.Sdk $version from the in-tree package ($sdk missing)" }
          $output = 'out\bin\Release\InternalAnalyzers\GSharp.InternalAnalyzers.dll'
          if (-not (Test-Path $output)) { throw "the BuildTask produced no $output" }
          Get-Item $sdk, $output | Format-Table FullName, Length, LastWriteTime

  # These checks are dormant until the standalone Go tool lands (#4562).
  go2gs:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'go2gs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/go2gs/go.sum
      - name: Restore go2gs
        working-directory: tools/go2gs
        run: go mod download
      - name: Test go2gs
        working-directory: tools/go2gs
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          go test -count=1 ./...
          go test -race -timeout 20m -count=1 ./...
          go vet ./...

  go2gs-windows:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'go2gs-windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/go2gs/go.sum
      - name: Test go2gs preload on Windows
        working-directory: tools/go2gs
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          $filter = '^(TestWindowsRootedMetadata.*|TestWindowsEnsureOutputRoot.*|TestWindowsOwnedTempCleanup.*|TestWindowsSelectedGoPlatformValidation|TestWindowsAtomicWrite.*|TestWindowsExecutableCapsule.*|TestWindowsRootEntryIdentity.*|TestOwnedTemporaryDirectoryCleanupIsIdentitySafe|TestOutputInvalidation.*|TestStaleInvalidation.*|TestBoundOutputRoot.*|TestArtifactPair.*|TestOutputReleaseFailure.*|TestSourcePositionMap.*|TestArchitectureFeature.*|TestPublicAnalyzeMatchingProfileInvalidatesBeforeUnsupportedBinding|TestPublicAnalyzeVersionMismatchPublishesDeterministicPreloadArtifacts|TestPublicAnalyzeSourceMismatchPublishesConsistentBlocker|TestCliampProfileMismatchDoesNotExecuteNativeToolsOrLoadPackages)$'
          $securityTests = '^(TestWindowsRootedMetadata.*|TestWindowsEnsureOutputRoot.*|TestWindowsOwnedTempCleanup.*|TestOwnedTemporaryDirectoryCleanupIsIdentitySafe)$'
          $topLevelTests = @(go test -list '^Test' .)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $relevantTests = @($topLevelTests | Where-Object { $_ -match $securityTests })
          $selectedTests = @($relevantTests | Where-Object { $_ -match $filter })
          if ($relevantTests.Count -ne 10 -or $selectedTests.Count -ne 10) {
            throw "Windows security filter selected $($selectedTests.Count)/$($relevantTests.Count) relevant tests"
          }
          $publicationTests = @(
            'TestWindowsAtomicWriteClosesStagedHandleBeforeRename'
            'TestWindowsExecutableCapsuleStagesReadOnlyEntry'
          )
          $missingPublicationTests = @($publicationTests | Where-Object { $_ -notin $topLevelTests })
          if ($missingPublicationTests.Count -ne 0) {
            throw "Windows publication tests are missing: $($missingPublicationTests -join ', ')"
          }
          $requiredPassTests = @($selectedTests + $publicationTests)
          function Get-SecurityTestResult {
            param(
              [object[]]$Events,
              [string[]]$SelectedTests
            )
            foreach ($test in $SelectedTests) {
              $topLevelEvents = @($Events | Where-Object { $_.Test -eq $test })
              if ($topLevelEvents | Where-Object { $_.Action -eq 'skip' }) {
                return [pscustomobject]@{ ExitCode = 1; Message = "Windows security test skipped: $test" }
              }
              $terminalEvents = @($topLevelEvents | Where-Object { $_.Action -in @('pass', 'fail', 'skip') })
              if ($terminalEvents.Count -eq 0 -or $terminalEvents[-1].Action -ne 'pass') {
                return [pscustomobject]@{ ExitCode = 1; Message = "Windows security test did not finish with pass: $test" }
              }
              $skippedSubtests = @($Events | Where-Object {
                $_.Action -eq 'skip' -and
                -not [string]::IsNullOrEmpty($_.Test) -and
                $_.Test.StartsWith($test + '/', [System.StringComparison]::Ordinal)
              })
              if ($skippedSubtests.Count -ne 0) {
                return [pscustomobject]@{
                  ExitCode = 1
                  Message = "Windows security test has skipped subtests: $($skippedSubtests.Test -join ', ')"
                }
              }
            }
            return [pscustomobject]@{ ExitCode = 0; Message = '' }
          }
          function Get-GoTestSecurityResult {
            param(
              [string[]]$RawEvents,
              [string[]]$SelectedTests,
              [int]$ExitCode
            )
            if ($ExitCode -ne 0) {
              return [pscustomobject]@{ ExitCode = $ExitCode; Message = "go test exited with code $ExitCode" }
            }
            try {
              $parsedEvents = @($RawEvents | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
            }
            catch {
              return [pscustomobject]@{ ExitCode = 1; Message = "invalid go test JSON event: $_" }
            }
            return Get-SecurityTestResult $parsedEvents $SelectedTests
          }
          function Assert-SimulatedResult {
            param([string]$Name, [object]$Result, [int]$ExpectedExitCode)
            if ($Result.ExitCode -ne $ExpectedExitCode) {
              throw "$Name simulation returned $($Result.ExitCode), expected $ExpectedExitCode`: $($Result.Message)"
            }
          }
          function ConvertTo-SimulatedJson {
            param([object[]]$Events)
            return @($Events | ForEach-Object { $_ | ConvertTo-Json -Compress })
          }
          $passingEvents = @(
            foreach ($test in $requiredPassTests) {
              [pscustomobject]@{ Action = 'run'; Test = $test }
              [pscustomobject]@{ Action = 'pass'; Test = $test }
            }
          )
          $runThenSkipEvents = @($passingEvents)
          $runThenSkipEvents += [pscustomobject]@{ Action = 'skip'; Test = $requiredPassTests[0] }
          Assert-SimulatedResult 'run+skip' (Get-GoTestSecurityResult (ConvertTo-SimulatedJson $runThenSkipEvents) $requiredPassTests 0) 1
          $subtestSkipEvents = @(
            foreach ($test in $requiredPassTests) {
              [pscustomobject]@{ Action = 'run'; Test = $test }
              if ($test -eq $requiredPassTests[0]) {
                [pscustomobject]@{ Action = 'run'; Test = "$test/skipped" }
                [pscustomobject]@{ Action = 'skip'; Test = "$test/skipped" }
              }
              [pscustomobject]@{ Action = 'pass'; Test = $test }
            }
          )
          Assert-SimulatedResult 'subtest skip' (Get-GoTestSecurityResult (ConvertTo-SimulatedJson $subtestSkipEvents) $requiredPassTests 0) 1
          Assert-SimulatedResult 'all pass' (Get-GoTestSecurityResult (ConvertTo-SimulatedJson $passingEvents) $requiredPassTests 0) 0
          $interleavedEvents = @(
            [pscustomobject]@{ Action = 'start'; Package = 'go2gs' }
            foreach ($test in $requiredPassTests) {
              [pscustomobject]@{ Action = 'run'; Test = $test }
              [pscustomobject]@{ Action = 'run'; Test = $test }
            }
            [pscustomobject]@{ Action = 'output'; Package = 'go2gs' }
            for ($index = $requiredPassTests.Count - 1; $index -ge 0; $index--) {
              [pscustomobject]@{ Action = 'pass'; Test = $requiredPassTests[$index] }
            }
            [pscustomobject]@{ Action = 'pass'; Package = 'go2gs' }
          )
          Assert-SimulatedResult 'interleaved duplicate events' (Get-GoTestSecurityResult (ConvertTo-SimulatedJson $interleavedEvents) $requiredPassTests 0) 0
          $missingPassEvents = @($passingEvents | Where-Object {
            -not ($_.Test -eq $requiredPassTests[-1] -and $_.Action -eq 'pass')
          })
          Assert-SimulatedResult 'missing pass' (Get-GoTestSecurityResult (ConvertTo-SimulatedJson $missingPassEvents) $requiredPassTests 0) 1
          Assert-SimulatedResult 'malformed JSON' (Get-GoTestSecurityResult @('not JSON') $requiredPassTests 0) 1
          Assert-SimulatedResult 'exit propagation' (Get-GoTestSecurityResult @('not JSON') $requiredPassTests 23) 23
          $events = @(go test -json -count=1 -run $filter .)
          $testExitCode = $LASTEXITCODE
          $result = Get-GoTestSecurityResult $events $requiredPassTests $testExitCode
          $events | ForEach-Object { Write-Output $_ }
          if ($result.ExitCode -ne 0) {
            if ($result.ExitCode -eq $testExitCode -and $testExitCode -ne 0) {
              exit $testExitCode
            }
            throw $result.Message
          }
          go vet ./...

  go2gs-macos:
    needs: select
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'go2gs-macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: tools/go2gs/go.sum
      - name: Restore go2gs
        working-directory: tools/go2gs
        run: go mod download
      - name: Test go2gs on macOS
        working-directory: tools/go2gs
        env:
          GOTOOLCHAIN: local
        run: |
          go mod verify
          go test -count=1 ./...
          go vet ./...

  r2r-compiler-smoke:
    # ADR-0207 / #5155: install the packages built on Linux and run the ReadyToRun compiler on each OS and
    # architecture. The script restores the Gsharp.NET.Sdk.Compiler.<rid> package of the host with an empty
    # NuGet cache, builds a project and a generator project, and compares the output with the IL compiler.
    # The labels are GitHub-hosted runners (arm64 runners are free for public repositories). A RID whose job
    # cannot run must be named as unverified in the release notes.
    name: r2r-compiler-smoke (${{ matrix.rid }})
    needs: [select, build]
    if: contains(fromJSON(needs.select.outputs.plan).jobs, 'r2r-compiler-smoke')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-15-intel }

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs-smoke

      # The script takes its expectations from the host it runs on. Check that this host is the one
      # that the matrix entry names, so that an emulated or unsupported host cannot pass for another RID.
      - name: Check the host RID
        shell: bash
        run: |
          host=$(dotnet --info | sed -n 's/^ *RID: *//p' | head -1 | tr -d '\r')
          echo "host RID: $host, matrix RID: ${{ matrix.rid }}"
          test "$host" = "${{ matrix.rid }}"

      - name: Run the ReadyToRun compiler smoke
        shell: bash
        env:
          GSHARP_R2R_NUPKG_DIR: nupkgs-smoke
        run: bash e2etests/r2r-compiler-e2e.sh

  ci:
    if: always()
    permissions:
      # actions: read lets ci-selection.py list the smoke legs of this run through the jobs API.
      contents: read
      actions: read
    outputs:
      unverified_rids: ${{ steps.check.outputs.unverified_rids }}
    needs: [select, build, discover-tests, tests, test-partition, harness, format, e2e, ilverify, release-version-refs, cs2gs-corpus, vscode-extension, vsix, visual-studio-extension, desktop-msbuild-sdk-smoke, r2r-compiler-smoke, go2gs, go2gs-windows, go2gs-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require every selected build job to succeed
        id: check
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
          # ADR-0218: advisory only on a release tag; PRs and main still require it.
          ADVISORY_JOBS: r2r-compiler-smoke
          GH_TOKEN: ${{ github.token }}
        run: python3 build/ci-selection.py --check build

  # ADR-0218: one job per destination. "Re-run failed jobs" on the tag run is the only retry tool.
  # Every job states its condition in full: the implicit success() also looks at failed ancestors
  # (a failed advisory r2r-compiler-smoke leg sits behind ci), so a default `needs` job would be skipped.
  # !cancelled() and not always(), because always() also runs in a cancelled run.
  publish-verify:
    needs: [ci]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      vscode_version: ${{ steps.verify.outputs.vscode_version }}
      visual_studio_version: ${{ steps.verify.outputs.visual_studio_version }}
      unverified_rids: ${{ needs.ci.outputs.unverified_rids }}

    steps:
      - uses: actions/checkout@v5

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Download VSIX
        uses: actions/download-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: ./vsix

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: ./vsix

      - name: Verify the artifacts against the tag
        id: verify
        run: python3 build/release-publish.py verify --nupkgs ./nupkgs --vsix ./vsix --tag "$GITHUB_REF_NAME"

  publish-github-release:
    needs: [publish-verify]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Download VSIX
        uses: actions/download-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: ./vsix

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: ./vsix

      # The release stays a draft until publish-finalize. view || create and upload --clobber make a re-run safe.
      - name: Create the draft GitHub release and upload the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.publish-verify.outputs.prerelease }}
        run: |
          flags=(--draft --generate-notes --title "$GITHUB_REF_NAME")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" ./nupkgs/*.nupkg ./nupkgs/*.snupkg ./vsix/*.vsix --repo "$GITHUB_REPOSITORY" --clobber

  publish-nuget-compiler:
    needs: [publish-verify]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # nuget.org trusted publishing (#5535): id-token: write lets NuGet/login get a GitHub OIDC token.
      # A job-level permissions key replaces the defaults, so contents: read keeps actions/checkout working.
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # nuget.org trusted publishing (#5535). The key is valid for one hour, so this step runs right before the push.
      # Each job and each re-run requests its own key. The steps after the push do not use the key.
      - name: Get a short-lived nuget.org API key (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: david-obando

      # ADR-0207: Gsharp.NET.Sdk restores Gsharp.NET.Sdk.Compiler.<rid> of its exact version with
      # PackageDownload, so the six RID packages go first. --skip-duplicate makes a re-run push only what is missing.
      - name: Push the six RID compiler packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: python3 build/release-publish.py nuget-push --group compiler --nupkgs ./nupkgs

      - name: Wait until the six RID compiler packages are on NuGet
        run: python3 build/check-rid-packages.py --packages ./nupkgs --wait-minutes 30

  publish-nuget-sdk:
    needs: [publish-verify, publish-nuget-compiler]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' && needs.publish-nuget-compiler.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # nuget.org trusted publishing (#5535): id-token: write lets NuGet/login get a GitHub OIDC token.
      # A job-level permissions key replaces the defaults, so contents: read keeps actions/checkout working.
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download NuGet packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The needs edge orders the jobs; this check orders them again on the feed itself (ADR-0207 result 6).
      - name: Check that the six RID compiler packages are on NuGet
        run: python3 build/check-rid-packages.py --packages ./nupkgs

      # nuget.org trusted publishing (#5535). The key is valid for one hour, so this step runs right before the push.
      # Each job and each re-run requests its own key. The steps after the push do not use the key.
      - name: Get a short-lived nuget.org API key (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: david-obando

      - name: Push Gsharp.NET.Sdk and the remaining packages to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: python3 build/release-publish.py nuget-push --group sdk --nupkgs ./nupkgs

      - name: Check that the SDK and all six RID compiler packages exist on NuGet
        run: python3 build/check-rid-packages.py --packages ./nupkgs --wait-minutes 15 --require-sdk

  publish-vscode-marketplace:
    needs: [publish-verify, publish-nuget-sdk]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' && needs.publish-nuget-sdk.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download VSIX
        uses: actions/download-artifact@v5
        with:
          name: vscode-gsharp-vsix
          path: ./vsix

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # A present version is success: a timeout after the upload was accepted must not fail a re-run.
      # The marketplace answer, not the vsce exit code, decides. The pre-release marker is inside the VSIX
      # (the vsix job packages with --pre-release for a prerelease tag), so publish passes no flag.
      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.publish-verify.outputs.vscode_version }}
          PRERELEASE: ${{ needs.publish-verify.outputs.prerelease }}
        run: |
          kind=release
          if [ "$PRERELEASE" = true ]; then kind=prerelease; fi
          query() { python3 build/release-publish.py marketplace-version gsharplang.vscode-gsharp --version "$VERSION" --kind "$kind" "$@"; }
          if query; then exit 0; else rc=$?; fi
          if [ "$rc" != 1 ]; then exit "$rc"; fi
          npx --yes @vscode/vsce@3.9.2 publish --packagePath ./vsix/vscode-gsharp.vsix --skip-duplicate \
            || echo "vsce failed; the marketplace query below decides"
          query --wait-minutes 5

  publish-visual-studio-marketplace:
    needs: [publish-verify, publish-nuget-sdk]
    # Skipped on any prerelease tag: the Visual Studio Marketplace has no pre-release channel.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' && needs.publish-nuget-sdk.result == 'success' && needs.publish-verify.outputs.prerelease != 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download Visual Studio VSIX
        uses: actions/download-artifact@v5
        with:
          name: visual-studio-gsharp-vsix
          path: ./vsix

      # VsixPublisher overwrites a version that exists, and the version has a per-build fourth part.
      # A present version is still success, so a re-run does not publish twice.
      - name: Publish to the Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.publish-verify.outputs.visual_studio_version }}
        run: |
          python build/release-publish.py marketplace-version gsharplang.GSharp-VisualStudio --version $env:VERSION
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw "Marketplace query failed with exit code $LASTEXITCODE." }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VSSDK `
            -property installationPath
          if (-not $installPath) {
            throw "Visual Studio SDK installation not found."
          }

          $publisher = Join-Path $installPath `
            "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"
          if (-not (Test-Path $publisher)) {
            throw "VsixPublisher.exe not found at $publisher."
          }

          & $publisher publish `
            -payload "$PWD\vsix\GSharp.VisualStudio.vsix" `
            -publishManifest "$PWD\src\vs-gsharp\vs-publish.json" `
            -personalAccessToken $env:VS_MARKETPLACE_PAT
          if ($LASTEXITCODE -ne 0) {
            # The upload may have been accepted before the client lost the answer; the query below decides.
            Write-Warning "VsixPublisher failed with exit code $LASTEXITCODE; the marketplace query below decides."
          }

          python build/release-publish.py marketplace-version gsharplang.GSharp-VisualStudio --version $env:VERSION --wait-minutes 5
          if ($LASTEXITCODE -ne 0) { throw "The Visual Studio Marketplace does not list $env:VERSION." }

  # Runs after a failure too, to report what is missing, but not in a cancelled run. The release becomes
  # public only when every destination has the version.
  publish-finalize:
    needs: [publish-verify, publish-github-release, publish-vscode-marketplace, publish-visual-studio-marketplace]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish-verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Check every destination and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-verify.outputs.version }}
          PRERELEASE: ${{ needs.publish-verify.outputs.prerelease }}
          VSCODE_VERSION: ${{ needs.publish-verify.outputs.vscode_version }}
          VISUAL_STUDIO_VERSION: ${{ needs.publish-verify.outputs.visual_studio_version }}
          UNVERIFIED_RIDS: ${{ needs.publish-verify.outputs.unverified_rids }}
          GITHUB_RELEASE_RESULT: ${{ needs.publish-github-release.result }}
          VSCODE_RESULT: ${{ needs.publish-vscode-marketplace.result }}
          VISUAL_STUDIO_RESULT: ${{ needs.publish-visual-studio-marketplace.result }}
        run: |
          python3 build/release-publish.py finalize --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" --prerelease "$PRERELEASE" \
            --vscode-version "$VSCODE_VERSION" --visual-studio-version "$VISUAL_STUDIO_VERSION" \
            --unverified "$UNVERIFIED_RIDS" \
            --github-release "$GITHUB_RELEASE_RESULT" --vscode "$VSCODE_RESULT" --visual-studio "$VISUAL_STUDIO_RESULT" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
