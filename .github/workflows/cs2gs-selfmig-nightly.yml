name: cs2gs-selfmig-nightly

# The consolidated cs2gs nightly: two independent pieces of work in one run.
#
#   selfmig  the repository self-migration gate (issue #3501 Track C). Migrates
#            the entire GSharp repository C# → G# and enforces the ratcheting
#            baseline in tools/cs2gs/selfmig-baseline.json. The jobs
#            (migrate → validate shards → gate) live in the reusable workflow
#            cs2gs-selfmig.yml, which build.yml also calls for PRs; see its
#            header for the design and for why it is a separate file.
#
#   corpus   ADR-0138: the deep C#→G# coverage run (formerly its own
#            workflow, cs2gs-nightly.yml). Unlike the PR gates (build.yml
#            `cs2gs-corpus` and `cs2gs-oahu` jobs), it runs the ledger in
#            STRICT mode (stale open entries fail so the ledger cannot rot) and
#            then AUTO-FILES GitHub issues for any new gap fingerprints
#            (clustered by root cause, capped per run), pushing the updated
#            ledger back as a pull request for review. It is the only job
#            here with write permissions, which is why it is not part of the
#            reusable workflow the PR gate calls.
#
# Both jobs are independent: a red self-migration gate does not stop the
# corpus run filing its issues, and vice versa.
#
# Single schedule: the former cs2gs-nightly (07:17 UTC) slot was folded into
# this one, so the corpus job now runs at 13:23 UTC alongside the
# self-migration run (windows-nightly 09:23 and macos-nightly 11:23 are
# unchanged).

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

# Read-only by default; the corpus job widens its own token below.
permissions:
  contents: read

env:
  # Parallel MSBuild nodes corrupt $GITHUB_ENV via Nerdbank.GitVersioning's
  # GitBuildVersion* emission; nothing consumes those variables, so disable
  # it (see build.yml for the full rationale).
  NBGV_SetCloudBuildVersionVars: false

jobs:
  selfmig:
    # Called workflow jobs surface as `selfmig / migrate`, `selfmig / validate
    # (<shard>)` and `selfmig / gate`. `actions: read` is required by the
    # migrate job's previous-run duration-map download.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cs2gs-selfmig.yml

  corpus:
    name: corpus (ADR-0138 strict ledger)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.sln --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build GSharp.sln --configuration Release --no-restore -graph

      - name: Migrate corpus (strict ledger gate)
        id: migrate
        run: |
          set +e
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll migrate \
            --diagnostic-run \
            --corpus tools/cs2gs/corpus \
            --baseline tools/cs2gs/triage/gaps.json \
            --baseline-strict \
            --out cs2gs-corpus-nightly-runs \
            --config Release | tee cs2gs-migrate.log
          exit_code=${PIPESTATUS[0]}
          run_dir=$(ls -d cs2gs-corpus-nightly-runs/*/ | head -1)
          echo "run_dir=${run_dir%/}" >> "$GITHUB_OUTPUT"
          echo "migrate_exit=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "### cs2gs corpus nightly migration"
            echo ''
            echo '```'
            cat cs2gs-migrate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The gate outcome is reported at the END of the job (after filing),
          # so a red night still files its issues first.
          exit 0

      - name: Migrate and run pinned Oahu
        id: oahu_pinned
        env:
          OAHU_GATE_ROOT: ${{ runner.temp }}/cs2gs-oahu-pinned
        run: |
          set +e
          ./build/run-cs2gs-oahu.sh | tee cs2gs-oahu-pinned.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Migrate and run Oahu C# branch head (advisory)
        id: oahu_csharp_head
        env:
          OAHU_GATE_LABEL: csharp-head
          OAHU_GATE_ROOT: ${{ runner.temp }}/cs2gs-oahu-csharp-head
          OAHU_REF: cs2gs/oahu-csharo
        run: |
          set +e
          ./build/run-cs2gs-oahu.sh | tee cs2gs-oahu-csharp-head.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: File issues for new gaps (automated, ADR-0138 guardrails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll triage file-issues \
            --run "${{ steps.migrate.outputs.run_dir }}" \
            --gaps tools/cs2gs/triage/gaps.json \
            --file --limit 10 | tee cs2gs-triage.log
          {
            echo "### cs2gs triage (auto-filed issues)"
            echo ''
            echo '```'
            cat cs2gs-triage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open ledger update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- tools/cs2gs/triage/gaps.json; then
            echo "ledger unchanged; no PR needed."
            exit 0
          fi
          branch="cs2gs/nightly-ledger-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/cs2gs/triage/gaps.json
          git commit -m "cs2gs: ledger new gap fingerprints from the nightly run

          Auto-filed by the cs2gs corpus nightly (ADR-0138); see the linked issues in the
          ledger entries."
          git push origin "$branch"
          gh pr create --fill --title "cs2gs: nightly gap-ledger update" \
            --body "Automated ledger update from the cs2gs nightly run. Each new entry links its auto-filed issue. Review the clustering (supersededBy) before merging."

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-corpus-nightly-report
          path: |
            cs2gs-corpus-nightly-runs/**/report.html
            cs2gs-corpus-nightly-runs/**/summary.json
            cs2gs-corpus-nightly-runs/**/run.json
            cs2gs-oahu-pinned.log
            cs2gs-oahu-csharp-head.log
            ${{ runner.temp }}/cs2gs-oahu-pinned/migrate.log
            ${{ runner.temp }}/cs2gs-oahu-pinned/runs/**/report.html
            ${{ runner.temp }}/cs2gs-oahu-pinned/runs/**/summary.json
            ${{ runner.temp }}/cs2gs-oahu-pinned/runs/**/run.json
            ${{ runner.temp }}/cs2gs-oahu-pinned/smoke/*
            ${{ runner.temp }}/cs2gs-oahu-csharp-head/migrate.log
            ${{ runner.temp }}/cs2gs-oahu-csharp-head/runs/**/report.html
            ${{ runner.temp }}/cs2gs-oahu-csharp-head/runs/**/summary.json
            ${{ runner.temp }}/cs2gs-oahu-csharp-head/runs/**/run.json
            ${{ runner.temp }}/cs2gs-oahu-csharp-head/smoke/*

      - name: Report advisory and enforce gate outcome
        run: |
          # The Oahu C# branch head detects upstream drift but stays advisory,
          # so changes cannot break this repository's pinned compatibility gate.
          if [[ "${{ steps.oahu_csharp_head.outputs.exit_code }}" != "0" ]]; then
            echo "::warning title=Oahu C# branch compatibility::Oahu C# branch head gate failed (exit ${{ steps.oahu_csharp_head.outputs.exit_code }}); pinned Oahu remains the enforced compatibility baseline."
          fi
          if [[ "${{ steps.migrate.outputs.migrate_exit }}" != "0" ||
                "${{ steps.oahu_pinned.outputs.exit_code }}" != "0" ]]; then
            exit 1
          fi
