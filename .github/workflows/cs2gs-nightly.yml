name: cs2gs-nightly

# ADR-0138: the deep C#→G# coverage run. Unlike the PR gate (build.yml
# `cs2gs-corpus` job), the nightly runs the ledger in STRICT
# mode (stale open entries fail so the ledger cannot rot) and then AUTO-FILES
# GitHub issues for any new gap fingerprints (clustered by root cause, capped
# per run), pushing the updated ledger back as a pull request for review.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      issue_5976_first_cause:
        description: 'Private initial-native-binlog-only observation; diagnostic branch only'
        type: boolean
        default: false
      expected_sha:
        description: 'Parent-reviewed diagnostic commit SHA'
        type: string
        default: ''
      observation_scope:
        description: 'Explicit reviewed partial observation scope'
        type: choice
        options: [UNSPECIFIED, BINLOG_ONLY]
        default: UNSPECIFIED

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Parallel MSBuild nodes corrupt $GITHUB_ENV via Nerdbank.GitVersioning's
  # GitBuildVersion* emission; nothing consumes those variables, so disable
  # it (see build.yml for the full rationale).
  NBGV_SetCloudBuildVersionVars: false

jobs:
  nightly:
    if: github.event_name != 'workflow_dispatch' || !inputs.issue_5976_first_cause
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build GSharp.slnx --configuration Release --no-restore -graph

      - name: Migrate corpus (strict ledger gate)
        id: migrate
        run: |
          set +e
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll migrate \
            --diagnostic-run \
            --corpus tools/cs2gs/corpus \
            --baseline tools/cs2gs/triage/gaps.json \
            --baseline-strict \
            --out cs2gs-nightly-runs \
            --config Release | tee cs2gs-migrate.log
          exit_code=${PIPESTATUS[0]}
          run_dir=$(ls -d cs2gs-nightly-runs/*/ | head -1)
          echo "run_dir=${run_dir%/}" >> "$GITHUB_OUTPUT"
          echo "migrate_exit=$exit_code" >> "$GITHUB_OUTPUT"
          {
            echo "### cs2gs nightly migration"
            echo ''
            echo '```'
            cat cs2gs-migrate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The gate outcome is reported at the END of the job (after filing),
          # so a red night still files its issues first.
          exit 0

      - name: File issues for new gaps (automated, ADR-0138 guardrails)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet out/bin/Release/Cs2Gs.Cli/cs2gs.dll triage file-issues \
            --run "${{ steps.migrate.outputs.run_dir }}" \
            --gaps tools/cs2gs/triage/gaps.json \
            --file --limit 10 | tee cs2gs-triage.log
          {
            echo "### cs2gs triage (auto-filed issues)"
            echo ''
            echo '```'
            cat cs2gs-triage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open ledger update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- tools/cs2gs/triage/gaps.json; then
            echo "ledger unchanged; no PR needed."
            exit 0
          fi
          branch="cs2gs/nightly-ledger-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tools/cs2gs/triage/gaps.json
          git commit -m "cs2gs: ledger new gap fingerprints from the nightly run

          Auto-filed by cs2gs-nightly (ADR-0138); see the linked issues in the
          ledger entries."
          git push origin "$branch"
          gh pr create --fill --title "cs2gs: nightly gap-ledger update" \
            --body "Automated ledger update from the cs2gs nightly run. Each new entry links its auto-filed issue. Review the clustering (supersededBy) before merging."

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-nightly-report
          path: |
            cs2gs-nightly-runs/**/report.html
            cs2gs-nightly-runs/**/summary.json
            cs2gs-nightly-runs/**/run.json

      - name: Enforce gate outcome
        run: |
          if [[ "${{ steps.migrate.outputs.migrate_exit }}" != "0" ]]; then
            exit 1
          fi

  issue-5976-first-cause:
    name: issue-5976-first-cause (diagnostic-only)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.issue_5976_first_cause &&
      inputs.observation_scope == 'BINLOG_ONLY' &&
      github.ref == 'refs/heads/oats/5976-first-submission-cause' &&
      github.sha == inputs.expected_sha &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact approved observation identity
        id: guard5976
        env:
          OBS_EVENT: ${{ github.event_name }}
          OBS_REF: ${{ github.ref }}
          OBS_SHA: ${{ github.sha }}
          OBS_ATTEMPT: ${{ github.run_attempt }}
          OBS_ENABLED: ${{ inputs.issue_5976_first_cause }}
          OBS_EXPECTED: ${{ inputs.expected_sha }}
          OBS_SCOPE: ${{ inputs.observation_scope }}
        run: python3 build/hot-reload-first-cause.py guard
      - name: Setup .NET SDK (main)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Setup .NET 8 (for multitarget tests)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore SDK and cs2gs dependency graph
        run: python3 build/ci-projects.py restore --projects "tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj src/Sdk/Gsharp.Templates/Gsharp.Templates.gsproj"
      - name: Install netcoredbg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build/install-netcoredbg.sh
      - name: Run original end-to-end suite with private capture
        id: e2e5976
        env:
          GSHARP_HOT_RELOAD_FIRST_CAUSE: BINLOG_ONLY
        run: |
          test ! -e out/artifacts/issue-5976-first-cause/capture
          printf 'capture_fresh=true\n' >> "$GITHUB_OUTPUT"
          set +e
          ./build/run-e2e-tests.sh
          status=$?
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Project private capture after the suite
        id: project5976
        if: always() && steps.guard5976.outcome == 'success' && steps.e2e5976.outputs.capture_fresh == 'true'
        env:
          E2E_EXIT: ${{ steps.e2e5976.outputs.exit_code || '255' }}
        run: |
          raw=out/artifacts/issue-5976-first-cause/capture/raw
          mkdir -p "$raw"
          python3 build/hot-reload-first-cause.py project "$E2E_EXIT" >"$raw/private-driver.log" 2>&1
      - name: Validate the exact public payload
        id: validate5976
        if: always() && steps.project5976.outcome == 'success'
        run: |
          raw=out/artifacts/issue-5976-first-cause/capture/raw
          python3 build/hot-reload-first-cause.py validate >"$raw/private-validator.log" 2>&1
      - name: Upload field-only diagnostic result
        if: always() && steps.validate5976.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: issue-5976-initial-native-binlog-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            out/artifacts/issue-5976-first-cause/capture/publish/summary.json
            out/artifacts/issue-5976-first-cause/capture/publish/manifest.json
      - name: Remove only private capture
        if: always() && steps.guard5976.outcome == 'success' && steps.e2e5976.outputs.capture_fresh == 'true'
        run: python3 build/hot-reload-first-cause.py cleanup >/dev/null 2>&1
