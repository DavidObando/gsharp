name: cs2gs-pr-guard

# Issue #3836: the PR-time translation guard for the self-migration effort
# (#3501).
#
# WHY THIS EXISTS
#
# build.yml COMPILES the repository's C# sources. The nightly
# cs2gs-selfmig-nightly gate TRANSLATES them to G# and then compiles the
# result. Those are different questions, so a fully CI-green PR can take the
# gate down purely by existing — and the damage lands hours later, attributed
# to whatever else merged nearby. Three times so far:
#
#   #3831  a new tools/cs2gs/Cs2Gs.Translator file did not translate;
#          7 banked apps red, gate 43 -> 35.
#   #3896  three untranslatable errors in #3882's new src/Core files;
#          16 apps red, gate 44 -> 28.
#   #3905  #3882's src/Sdk/Gsharp.Runtime.Channels crashed gsc with a stack
#          overflow, blinding 11 apps.
#
# Each was found the slow way. All three are the same shape: a project most of
# the corpus transitively references stopped surviving its own migration. This
# job migrates exactly that hot core, on the PR, in minutes.
#
# WHAT IT IS NOT
#
# It is not the gate. It checks six projects, not fifty-three; it says
# nothing about the readability ceilings or corpus-wide test parity. The job's
# own output repeats that on every run, pass or fail, because a partial check
# mistaken for a full one is worse than no check at all.
#
# The guarded set now includes src/Sdk/Gsharp.Runtime.Channels and
# src/Formatting/GSharp.Formatting in addition to the original hot core. See
# build/run-cs2gs-selfmig-pr-guard.sh for the closed ProjectReference set.
#
# THE TRIGGER: every PR to `main`, no `paths:` filter
#
# Matching build.yml, and deliberately so. The reason is REQUIRED-CHECK
# ELIGIBILITY, not cost.
#
# A `paths:`-filtered workflow does not report a neutral status when the
# filter misses: GitHub skips the workflow and the check never appears at all.
# A required check in that state parks every docs-only or website-only PR
# forever on "Expected — waiting for status to be reported". So a top-level
# `paths:` filter and "required" are mutually exclusive, and this guard is
# worth more as a required check than as a cheap one — #3831, #3896 and #3905
# each reached `main` with CI fully green, which is precisely the situation an
# advisory check does not survive.
#
# WHAT THAT COSTS
#
# The job takes ~30-45 minutes (five consecutive runs measured 29, 41, 44, 44
# and 45 minutes), and it is now paid on PRs that cannot possibly affect
# translation. build.yml's entire matrix finishes in ~21-25 minutes, so on a
# docs-only PR this guard becomes the critical path and roughly doubles the
# time to green. That is the price of the check being reportable on every PR.
#
# WHAT THE OLD FILTER SAID, AND WHERE THAT KNOWLEDGE LIVES NOW
#
# It was scoped to what this job can actually judge: the guarded projects'
# sources (src/Core, src/Analyzers/InternalAnalyzers,
# src/Formatting/GSharp.Formatting, src/Sdk/Gsharp.Runtime.Channels), the
# whole tools/cs2gs tree — which decides how those sources translate, not just
# the two guarded projects in it — plus src/Compiler and src/Sdk/Gsharp.NET.Sdk,
# which decide whether the translated result compiles (#3905 was a gsc crash,
# not a translation defect), and this job's own definition.
#
# That set is still the honest answer to "which changes can turn this job
# red". It is simply no longer the answer to "when does this job run". If the
# cost above stops being acceptable, the shape to reach for is a changed-paths
# step INSIDE the job that short-circuits the expensive steps with `if:`, so
# the check still reports on every PR. Do not reintroduce a top-level `paths:`
# filter while this check is required — that is the failure this trigger
# exists to avoid.
#
# `push:` on `main` is deliberately absent, and `tags:` more so. This is a
# PR-time instrument (see the concurrency group, keyed on the PR number); the
# nightly cs2gs-selfmig gate is the `main`-branch one, and `workflow_dispatch`
# covers an on-demand run.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cs2gs-pr-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # See build.yml: parallel MSBuild nodes corrupt $GITHUB_ENV via
  # Nerdbank.GitVersioning's GitBuildVersion* emission.
  NBGV_SetCloudBuildVersionVars: false
  SELFMIG_PR_GUARD_ROOT: /tmp/gsharp-cs2gs-pr-guard

jobs:
  guard:
    name: hot-core translation guard
    runs-on: ubuntu-latest
    # The measured run is well under this; the headroom is for a gsc hang,
    # which is a failure mode this job specifically exists to catch (#3905).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning needs history to compute a version, and the
          # migrated tree is restored as NuGet packages that carry it.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.sln --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      # The script builds the solution itself (which repacks the
      # Gsharp.NET.Sdk nupkg the compile stage consumes) and then migrates.
      # That ordering is load-bearing: a freshly built gsc.dll alone is
      # silently ignored by the packed-SDK compile path, and interleaving
      # another `dotnet build` between the pack and the migrate is how MSB4236
      # appears here. Do not add build steps above this one.
      - name: Migrate and compile the hot core
        run: ./build/run-cs2gs-selfmig-pr-guard.sh

      - name: Upload guard artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-pr-guard
          retention-days: 7
          path: |
            /tmp/gsharp-cs2gs-pr-guard/guard.log
            /tmp/gsharp-cs2gs-pr-guard/runs/**/*.json
            /tmp/gsharp-cs2gs-pr-guard/runs/**/report.html
            /tmp/gsharp-cs2gs-pr-guard/runs/**/sdk.build.log
            # The migrated .gs of the guarded projects, so a failure can be
            # read at the source rather than reproduced locally.
            /tmp/gsharp-cs2gs-pr-guard/migrated/**/*.gs
