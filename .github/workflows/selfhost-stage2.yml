name: selfhost-stage2

# ADR-0198 integrated positive control. Migrates the repository C# -> G#, runs
# the isolated stage-2 controller (stage-1 pack, stage-2 rebuild, complete-PE
# comparison of GSharp.Core.dll and gsc.dll, Core.Tests and Compiler.Tests under
# stage 2 in the sandbox) and fails unless the report is a real
# `certified: true`. It is deliberately a separate workflow: it takes hours, so
# it runs nightly, on demand, and on pull requests that touch the controller.

on:
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/selfhost-stage2.py'
      - 'build/selfhost_pe.py'
      - 'build/selfhost-pack-stage1.py'
      - 'build/selfhost/**'
      - 'build/verify-stage2-report.py'
      - 'build/run-selfhost-stage2-certification.sh'
      - '.github/workflows/selfhost-stage2.yml'

env:
  NBGV_SetCloudBuildVersionVars: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install stage-2 sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build controller helpers
        run: |
          dotnet restore build/selfhost/PackageContentHash.csproj --locked-mode
          dotnet restore build/selfhost/TestSupervisorLogger.csproj --locked-mode
          dotnet build build/selfhost/PackageContentHash.csproj --configuration Release --no-restore --nologo
          dotnet build build/selfhost/TestSupervisorLogger.csproj --configuration Release --no-restore --nologo

      - name: Certify (migrate, stage 1, stage 2, compare, test)
        run: build/run-selfhost-stage2-certification.sh "$RUNNER_TEMP/stage2-certification"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stage2-report
          path: |
            ${{ runner.temp }}/stage2-certification/controller/reports/stage2-report.json
            ${{ runner.temp }}/stage2-certification/migrate.log
          if-no-files-found: warn
