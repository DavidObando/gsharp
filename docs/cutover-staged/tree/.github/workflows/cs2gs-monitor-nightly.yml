name: cs2gs-monitor-nightly

# Replaces cs2gs-selfmig-nightly after the cut-over (self-hosting plan, #3501,
# Phase 4 item 4; owner decision D9). Nothing on `main` is C# compiler source
# any more, so there is nothing to self-migrate. This workflow keeps the
# regression signal: cs2gs is run nightly over every real-world app we cover.
#
#   gsharp-csharp  the C# version of G#: branch cs2gs/csharp-0.4 at the SHA in
#                  tools/cs2gs/external/gsharp-csharp.json. It is a frozen
#                  corpus (the final C#-built release's source).
#   oahu           tools/cs2gs/external/oahu.json
#   code-exploder  tools/cs2gs/external/code-exploder.json
#
# It is a monitor, not a PR gate. A red run is a cs2gs regression on real C#:
# file a P1 (P0 if it silently changes semantics) and fix cs2gs in G#.
#
# NOT YET IMPLEMENTED, Phase 4 work that this staged file only reserves a slot for:
#   * build/run-cs2gs-selfmig-*.sh assume the checkout IS the C# source. The
#     gsharp-csharp leg needs a source-root parameter (SELFMIG_SOURCE_ROOT
#     below) before it can run; the "Require source-root support" step fails
#     loudly until that exists, so the leg cannot pass vacuously.
#   * tools/cs2gs/external/gsharp-csharp.json (repository, branch, commit).
#   * Whether the leg runs all cs2gs pipeline stages (translate, compile,
#     ILVerify, test parity) or only the first two. D9 says "stages 1 and 2";
#     the owner should confirm which meaning is intended (see the cut-over
#     README, owner decisions).

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

env:
  NBGV_SetCloudBuildVersionVars: false

jobs:
  gsharp-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the frozen C# branch at the pinned commit
        run: |
          pinned=$(jq -r '.commit' tools/cs2gs/external/gsharp-csharp.json)
          git fetch --quiet origin "cs2gs/csharp-0.4"
          git worktree add "$RUNNER_TEMP/csharp-0.4" "$pinned"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build cs2gs (Release)
        run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph

      - name: Require source-root support
        run: |
          grep -q SELFMIG_SOURCE_ROOT build/selfmig-common.sh || {
            echo "::error::build/selfmig-common.sh has no SELFMIG_SOURCE_ROOT support yet (Phase 4 work)."
            exit 1
          }

      - name: Migrate the C# version of G#
        env:
          SELFMIG_SOURCE_ROOT: ${{ runner.temp }}/csharp-0.4
          SELFMIG_GATE_ROOT: ${{ runner.temp }}/gsharp-cs2gs-monitor
        run: ./build/run-cs2gs-selfmig.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-monitor-gsharp-csharp
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/gsharp-cs2gs-monitor/**/*.json

  oahu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore GSharp.slnx --locked-mode
      - run: dotnet tool restore
      - run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph
      - name: Migrate and run pinned Oahu
        run: ./build/run-cs2gs-oahu.sh

  code-exploder:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore GSharp.slnx --locked-mode
      - run: dotnet tool restore
      - run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph
      - name: Migrate and run pinned Code Exploder
        run: ./build/run-cs2gs-code-exploder.sh
