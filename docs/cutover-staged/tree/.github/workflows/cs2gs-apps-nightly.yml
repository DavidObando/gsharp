name: cs2gs-apps-nightly

# Replaces cs2gs-selfmig-nightly after the cut-over (self-hosting plan #3501,
# Phase 4 item 4; owner decisions D9 and the 2026-10-09 follow-ups).
# Nothing on `main` is C# compiler source any more, so there is nothing to
# self-migrate. This one nightly keeps the regression signal: cs2gs is run over
# every real-world app we cover, in ONE run with one end-of-run report.
#
# The tool under test is cs2gs as built from the checked-out MAIN tree (the
# migrator is written in G# now), built with the pinned toolchain from
# global.json. The apps are its INPUT, and all of them are C#. After the
# cut-over this nightly therefore runs the G#-built cs2gs against the C# source
# on the semi-frozen branch cs2gs/csharp-0.4 (plus Oahu and Code Exploder); it
# never translates anything on `main`, which is already G#:
#
#   gsharp-csharp  C# input: branch cs2gs/csharp-0.4 at the SHA pinned in
#                  tools/cs2gs/external/gsharp-csharp.json, checked out beside
#                  main and passed as SELFMIG_SOURCE_ROOT. The branch is
#                  semi-frozen: a living corpus that gets back-ports from G#
#                  when they exercise cs2gs (bump the pin in the same PR). The
#                  translated output IS the G# compiler tree; it is compiled,
#                  ILVerified and parity-tested.
#   oahu           C# input: tools/cs2gs/external/oahu.json
#   code-exploder  C# input: tools/cs2gs/external/code-exploder.json
#
# Oahu and Code Exploder used to be the PR jobs cs2gs-oahu and cs2gs-code-exploder
# in build.yml (and `publish` dependencies). They are out of PR and official
# builds and run only here, as legs of this one nightly job, so they no longer
# slow or block PRs. Their accounting is part of the end-of-run stats below.
# The self-host stage-2 check is separate: selfhost-stage2-nightly.yml.
#
# End-of-run stats: every app leg writes result-<app>.json, optionally with a
# "stats" object (stage counts, floors and readability counters, for ALL three
# apps including Oahu and Code Exploder). The `gate` job prints one table of
# them in the run summary.
#
# Failure handling: a failed gate opens a GitHub issue. For every red app the
# `gate` job files or updates ONE issue (build/cs2gs-apps-gate-issues.py),
# deduplicated by gate/app/failure fingerprint, whose body carries the gate
# report (summary, log tail, run URL), labeled cs2gs-nightly. Priority per
# CLAUDE.md: P0 only when a banked app (tools/cs2gs/apps-nightly-banked.json)
# goes red on main, otherwise P1.
#
# NOT YET IMPLEMENTED (Phase 4 work this file only reserves a slot for):
#   * build/run-cs2gs-selfmig-*.sh assume the checkout IS the C# source. The
#     gsharp-csharp leg needs SELFMIG_SOURCE_ROOT; "Require source-root
#     support" fails loudly until then, so the leg cannot pass vacuously.
#   * tools/cs2gs/external/gsharp-csharp.json and
#     tools/cs2gs/apps-nightly-banked.json (a {"banked": [...]} list; an app is
#     added only after it has been seen green on main).
#   * Per-app accounting from the old gate (stage floors, readability counters)
#     is produced by the leg scripts; fold it into result-<app>.json "stats"
#     for every app, Oahu and Code Exploder included. The corpus of the
#     gsharp-csharp leg is 56 apps with greenFloor 56 once #4865 lands (the
#     untracked ildump scratch project no longer counts); carry those numbers
#     into the stats rather than the pre-#4865 57.

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

env:
  NBGV_SetCloudBuildVersionVars: false

permissions:
  contents: read

# Issue deduplication is search-then-create, so overlapping runs could file
# duplicates. Serialize runs.
concurrency:
  group: cs2gs-apps-nightly
  cancel-in-progress: false

jobs:
  app:
    name: app (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        app: [gsharp-csharp, oahu, code-exploder]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GSharp.slnx --locked-mode

      - name: Restore .NET local tools
        run: dotnet tool restore

      - name: Build cs2gs (Release)
        run: dotnet build tools/cs2gs/Cs2Gs.Cli/Cs2Gs.Cli.gsproj --configuration Release --no-restore -graph

      - name: Check out the C# input (cs2gs/csharp-0.4, pinned) as the source corpus
        if: matrix.app == 'gsharp-csharp'
        run: |
          pinned=$(jq -r '.commit' tools/cs2gs/external/gsharp-csharp.json)
          git fetch --quiet origin "cs2gs/csharp-0.4"
          git worktree add "$RUNNER_TEMP/csharp-0.4" "$pinned"
          grep -q SELFMIG_SOURCE_ROOT build/selfmig-common.sh || {
            echo "::error::build/selfmig-common.sh has no SELFMIG_SOURCE_ROOT support yet (Phase 4 work)."
            exit 1
          }

      - name: Migrate and validate ${{ matrix.app }}
        id: leg
        env:
          APP: ${{ matrix.app }}
          SELFMIG_SOURCE_ROOT: ${{ runner.temp }}/csharp-0.4
          # Every leg writes under the one directory the upload step collects.
          SELFMIG_GATE_ROOT: ${{ runner.temp }}/gsharp-cs2gs-gate/gsharp-csharp
          OAHU_GATE_ROOT: ${{ runner.temp }}/gsharp-cs2gs-gate/oahu
          CODE_EXPLODER_GATE_ROOT: ${{ runner.temp }}/gsharp-cs2gs-gate/code-exploder
        run: |
          set +e
          case "$APP" in
            gsharp-csharp) cmd=./build/run-cs2gs-selfmig.sh ;;
            oahu) cmd=./build/run-cs2gs-oahu.sh ;;
            code-exploder) cmd=./build/run-cs2gs-code-exploder.sh ;;
          esac
          "$cmd" 2>&1 | tee "$RUNNER_TEMP/leg.log"
          code=${PIPESTATUS[0]}
          status=green
          [[ $code -eq 0 ]] || status=red
          mkdir -p "$RUNNER_TEMP/results"
          python3 - "$APP" "$status" "$code" <<'PY'
          import json, os, sys
          app, status, code = sys.argv[1:4]
          tail = open(os.environ["RUNNER_TEMP"] + "/leg.log", errors="replace").read()[-8000:]
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          json.dump({"app": app, "gate": "cs2gs-apps-nightly", "status": status,
                     "summary": f"leg exited {code}", "log_tail": tail, "run_url": run},
                    open(os.environ["RUNNER_TEMP"] + f"/results/result-{app}.json", "w"))
          PY
          # The artifact upload and the gate job report the failure; do not
          # fail this leg twice.
          exit 0

      - name: Upload result and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cs2gs-apps-${{ matrix.app }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/results/result-*.json
            ${{ runner.temp }}/gsharp-cs2gs-gate/**/*.json
            ${{ runner.temp }}/gsharp-cs2gs-gate/**/*.log
            ${{ runner.temp }}/gsharp-cs2gs-gate/**/report.html
            ${{ runner.temp }}/gsharp-cs2gs-gate/oahu/smoke/*
            ${{ runner.temp }}/gsharp-cs2gs-gate/code-exploder/smoke/*

  gate:
    name: gate report
    needs: app
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Download results
        # If every leg failed before uploading, the download finds nothing and
        # errors. Continue so --expect below files the missing-result issues.
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: cs2gs-apps-*
          path: results
          merge-multiple: true

      - name: Summarize, then file or update issues for red apps
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p results
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("### cs2gs apps nightly")
          print("| app | status | summary | stats |\n|---|---|---|---|")
          seen = {}
          # Artifacts extract relative to their common ancestor, so results can be nested.
          for p in sorted(glob.glob("results/**/result-*.json", recursive=True)):
              r = json.load(open(p))
              seen[r["app"]] = r
          for app in ("gsharp-csharp", "oahu", "code-exploder"):
              r = seen.get(app) or {"status": "red", "summary": "no result: the leg crashed before reporting"}
              stats = ", ".join(f"{k}={v}" for k, v in sorted((r.get("stats") or {}).items())) or "n/a"
              print(f"| {app} | {r['status']} | {r.get('summary','')} | {stats} |")
          PY
          python3 build/cs2gs-apps-gate-issues.py \
            --results results \
            --banked tools/cs2gs/apps-nightly-banked.json \
            --expect gsharp-csharp,oahu,code-exploder \
            --ref "${GITHUB_REF_NAME}"
